context:
  version: "0.5.4"

package:
  name: helm-ls
  version: ${{ version }}

source:
  url: https://github.com/mrjosh/helm-ls/archive/v${{ version }}.tar.gz
  sha256: a8a5490084839af3506c85efcf603fbd71bb9ee37222bbd7817da1da3f054ab3
  target_directory: src

build:
  number: 2
  script:
    - cd src
    # no MinGW gcc targets win-arm64; zig ships aarch64 mingw-w64 headers and CRT
    - if: target_platform == "win-arm64"
      then: set "CC=zig cc -target aarch64-windows-gnu"
    - go-licenses save . --save_path ../library_licenses
    - if: unix
      then: go build -v -trimpath -o $PREFIX/bin/helm_ls -ldflags="-s -w -X main.Version=v${{ version }} -X main.Branch=v${{ version }}"
      else: go build -v -trimpath -o %LIBRARY_BIN%\helm_ls.exe -ldflags="-s -w -X main.Version=v${{ version }} -X main.Branch=v${{ version }}"

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
    # cgo on Windows requires a MinGW toolchain, MSVC is not supported
    - if: target_platform == "win-64"
      then:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - if: target_platform == "win-arm64"
      then:
        - zig
    - ${{ compiler("go-cgo") }}
    - go-licenses

tests:
  - script:
      - helm_ls --help
      - helm_ls version
  - package_contents:
      bin:
        - helm_ls
      strict: true

about:
  license: MIT
  license_file:
    - src/LICENSE
    - library_licenses/
  summary: Language server for Helm
  homepage: https://github.com/mrjosh/helm-ls
  repository: https://github.com/mrjosh/helm-ls

extra:
  recipe-maintainers:
    - danielnachun
    - pavelzw
